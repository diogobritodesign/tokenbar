name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  collector:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Shell scripts parse
        run: bash -n install.sh uninstall.sh scripts/ui-test.sh scripts/preview.sh
